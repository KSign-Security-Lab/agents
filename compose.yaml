# ---------------------------------------------------------------------------
#  What a developer's machine runs. Everything with a GPU moved to Kubernetes —
#  see k8s/ — so this is Postgres, Redis, and the ingest worker, nothing more.
#
#      docker compose up -d          docker compose ps
#      docker compose down           docker compose logs -f postgres
#
#  No -f and no --profile flags: what this machine runs is one line in .env.
#
#      COMPOSE_PROFILES=dev           postgres + redis
#      COMPOSE_PROFILES=dev,ingest    ...also the ingest worker
#
#  api and web are NOT here on purpose: they run on the host with hot reload,
#  started by `pnpm dev`, because that is the point of developing them. The
#  models are reached over the network — GPU_HOST in .env points at a cluster
#  node, and the application only ever knows LLM_BASE_URL.
# ---------------------------------------------------------------------------
name: agents

# One file per service, beside this one. Relative paths inside an included file
# resolve against THAT file's directory, so a volume of "./data" only means the
# repo root while the file is at the repo root.
include:
  - compose.postgres.yml
  - compose.redis.yml
  - compose.worker.yml

networks:
  agents:
    name: agents
