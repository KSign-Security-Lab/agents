# ---------------------------------------------------------------------------
#  Everything runs from here with plain docker compose:
#
#      docker compose up -d          docker compose ps
#      docker compose down           docker compose logs -f vllm
#
#  No -f, no --profile flags. What this machine runs is one line in .env:
#
#      COMPOSE_PROFILES=gpu           a GPU server
#      COMPOSE_PROFILES=dev           a developer's machine
#      COMPOSE_PROFILES=dev,ingest    ...also the ingest worker
#      COMPOSE_PROFILES=gpu,dev       both roles on one box
#
#  api and web are NOT here on purpose: they run on the host with hot reload,
#  started by `pnpm dev`, because that is the point of developing them.
#
#  gpu        llm-gateway + vllm + infer        needs CUDA
#  dev        postgres + redis                   no GPU, runs anywhere
#  ingest     worker                             big image; only to debug ingest
#
#  `docker compose config --profiles` lists these; --services lists what the
#  current .env actually starts.
#
#  Scaling is NOT expressed as profiles, because that does not extend past two.
#  More GPUs on this machine: TENSOR_PARALLEL / DATA_PARALLEL on the one vllm
#  service. GPUs on other machines: list them in LLM_UPSTREAMS and the gateway
#  pools them. Either way the application still only knows LLM_BASE_URL.
# ---------------------------------------------------------------------------
name: agents

x-gpu: &gpu
  # All GPUs are exposed to the container; CUDA_VISIBLE_DEVICES selects which
  # ones the process may actually use. This keeps the GPU mapping a pure env
  # var (compose cannot interpolate a list into device_ids).
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm: &vllm
  image: vllm/vllm-openai:latest        # verified against vLLM 0.17 / torch 2.10
  ipc: host
  shm_size: "8gb"
  restart: unless-stopped
  volumes:
    - ${MODEL_DIR:-./data/models/vllm}:/root/.cache/huggingface
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    VLLM_LOGGING_LEVEL: INFO
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
    interval: 20s
    timeout: 10s
    retries: 40
    start_period: 900s                  # first run downloads the model weights
  networks: [agents]

services:
  llm-gateway:
    profiles: ["gpu"]
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # Comma-separated host:port list. One entry is the normal case; more than
      # one makes this a least_conn pool, and the entries do not have to be on
      # this machine — LLM_UPSTREAMS=gpu-a:8601,gpu-b:8601 pools two servers.
      LLM_UPSTREAMS: ${LLM_UPSTREAMS:-vllm:8000}
    volumes:
      - ./docker/nginx/llm-gateway.conf.tmpl:/etc/nginx/templates/llm.conf.tmpl:ro
      - ./docker/nginx/entrypoint.sh:/docker-entrypoint.d/40-render-llm.sh:ro
    ports:
      # BIND_ADDR=0.0.0.0 publishes the gateway to the network so developers on
      # other machines can point LLM_BASE_URL here. Default stays loopback-only.
      - "${BIND_ADDR:-127.0.0.1}:${LLM_GATEWAY_PORT:-8602}:80"
    networks: [agents]

  # One service for any number of local GPUs. Scaling is vLLM's job, not
  # compose's: TENSOR_PARALLEL splits one model across cards, DATA_PARALLEL runs
  # that many copies inside the one server and load-balances between them, and
  # CUDA_VISIBLE_DEVICES says which cards it may touch. Four GPUs as two
  # tensor-parallel pairs is VLLM_GPUS=0,1,2,3 TENSOR_PARALLEL=2 DATA_PARALLEL=2
  # — no extra container, no extra profile.
  vllm:
    <<: [*vllm, *gpu]
    profiles: ["gpu"]
    environment:
      CUDA_VISIBLE_DEVICES: ${VLLM_GPUS:-0}
      TENSOR_PARALLEL: ${TENSOR_PARALLEL:-1}
      DATA_PARALLEL: ${DATA_PARALLEL:-1}
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.62}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      REASONING_PARSER: ${REASONING_PARSER:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    ports:
      # Published so a gateway on ANOTHER machine can pool this one. Still
      # loopback-only unless BIND_ADDR says otherwise.
      - "${BIND_ADDR:-127.0.0.1}:${VLLM_PORT:-8601}:8000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Only pass --data-parallel-size when it is actually >1, so the default
        # command line stays exactly what it was before this flag existed.
        DP=""
        [ "$$DATA_PARALLEL" -gt 1 ] && DP="--data-parallel-size $$DATA_PARALLEL"
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size "$$TENSOR_PARALLEL" \
          $$DP \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config '{"disable_any_whitespace":true,"backend":"xgrammar"}' \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  infer:
    profiles: ["gpu"]
    <<: *gpu
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      target: infer
    image: agents/infer:dev
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: ${INFER_GPUS:-1}
      HF_HOME: /models
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8_float16}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-ko}
    volumes:
      - ${INFER_MODEL_DIR:-./data/models/infer}:/models
      - ${DATA_ROOT:-./data}/storage:/storage
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${INFER_PORT:-8603}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    networks: [agents]

  postgres:
    profiles: ["dev"]
    image: pgvector/pgvector:pg17       # needs pgvector >= 0.7 for sparsevec
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents} -d ${POSTGRES_DB:-agents}"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [agents]

  # Opt-in: only needed to debug ingest (LibreOffice / OCR / ffmpeg are why this
  # image is large, and why it isn't started by default).
  worker:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      target: worker
    image: agents/worker:dev
    restart: unless-stopped
    environment:
      # Inside the container the deps are siblings, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-agents}@postgres:5432/${POSTGRES_DB:-agents}
      REDIS_URL: redis://redis:6379/0
      INFER_BASE_URL: ${INFER_BASE_URL:-http://localhost:8603}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8602/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      STORAGE_ROOT: /storage
      HF_HOME: /models
      OCR_USE_GPU: "false"
    volumes:
      - ${DATA_ROOT:-./data}/storage:/storage
      - ${DATA_ROOT:-./data}/models:/models
      - ${DATA_ROOT:-./data}/out:/out
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [agents]

networks:
  agents:
    name: agents
