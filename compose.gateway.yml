# ---------------------------------------------------------------------------
#  llm-gateway — the single URL the application talks to.
#
#  Included by compose.yaml — never used directly. What starts is decided by
#  COMPOSE_PROFILES in .env at the repo root.
#
#  Profile: gpu. It pools this machine's vllm, an optional second local
#  instance, and any GPU_PEERS — see docker/nginx/entrypoint.sh.
# ---------------------------------------------------------------------------
services:
  llm-gateway:
    profiles: ["gpu"]
    image: nginx:1.31.4-alpine
    restart: unless-stopped
    environment:
      # The OTHER GPU machines, by hostname or IP — this machine's own vllm is
      # always in the pool, so it is never listed. GPU_PEERS=10.0.0.12:8601 makes
      # this a least_conn pool over three.
      GPU_PEERS: ${GPU_PEERS:-}
      # so the pool picks up vllm-2 when that profile is active
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      VLLM_PORT: ${VLLM_PORT:-8601}
    volumes:
      - ./docker/nginx/llm-gateway.conf.tmpl:/etc/nginx/templates/llm.conf.tmpl:ro
      - ./docker/nginx/entrypoint.sh:/docker-entrypoint.d/40-render-llm.sh:ro
    ports:
      # BIND_ADDR=0.0.0.0 publishes the gateway to the network so developers on
      # other machines can point LLM_BASE_URL here. Default stays loopback-only.
      - "${BIND_ADDR:-127.0.0.1}:${LLM_GATEWAY_PORT:-8602}:80"
    networks: [agents]

  # One service for any number of local GPUs. Scaling is vLLM's job, not
  # compose's: TENSOR_PARALLEL splits one model across cards, DATA_PARALLEL runs
  # that many copies inside the one server and load-balances between them, and
  # CUDA_VISIBLE_DEVICES says which cards it may touch. Four GPUs as two
  # tensor-parallel pairs is VLLM_GPUS=0,1,2,3 TENSOR_PARALLEL=2 DATA_PARALLEL=2
  # — no extra container, no extra profile.

