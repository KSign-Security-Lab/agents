# ---------------------------------------------------------------------------
#  vllm — the model server, and an optional second instance.
#
#  Included by compose.yaml — never used directly. What starts is decided by
#  COMPOSE_PROFILES in .env at the repo root.
#
#  Profiles: gpu / model for the first, vllm2 for the second.
#
#  Both live here on purpose. A YAML anchor cannot cross a file boundary, and
#  they share one: the same image, the same 15-line `vllm serve` command, only
#  different cards. Splitting them would mean duplicating that command.
# ---------------------------------------------------------------------------
x-gpu: &gpu
  # All GPUs are exposed to the container; CUDA_VISIBLE_DEVICES selects which
  # ones the process may actually use. This keeps the GPU mapping a pure env
  # var (compose cannot interpolate a list into device_ids).
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm: &vllm
  # Pinned deliberately. `latest` moved under this repo once already and the
  # flags below were verified against 0.17 — bump it on purpose, not by pulling.
  image: vllm/vllm-openai:v0.17.0
  ipc: host
  shm_size: "8gb"
  restart: unless-stopped
  volumes:
    - ${MODEL_DIR:-./data/models/vllm}:/root/.cache/huggingface
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    VLLM_LOGGING_LEVEL: INFO
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      # Only pass --data-parallel-size when it is actually >1, so the default
      # command line stays exactly what it was before this flag existed.
      DP=""
      [ "$$DATA_PARALLEL" -gt 1 ] && DP="--data-parallel-size $$DATA_PARALLEL"
      exec vllm serve "$$MODEL_ID" \
        --served-model-name "$$SERVED_MODEL_NAME" \
        --max-model-len "$$MAX_MODEL_LEN" \
        --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
        --tensor-parallel-size "$$TENSOR_PARALLEL" \
        $$DP \
        --host 0.0.0.0 --port 8000 \
        --structured-outputs-config '{"disable_any_whitespace":true,"backend":"xgrammar"}' \
        $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
        $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
        $$VLLM_EXTRA_ARGS
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
    interval: 20s
    timeout: 10s
    retries: 40
    start_period: 900s                  # first run downloads the model weights
  networks: [agents]

services:
  # One service for any number of local GPUs. Scaling is vLLM's job, not
  # compose's: TENSOR_PARALLEL splits one model across cards, DATA_PARALLEL runs
  # that many copies inside the one server and load-balances between them, and
  # CUDA_VISIBLE_DEVICES says which cards it may touch. Four GPUs as two
  # tensor-parallel pairs is VLLM_GPUS=0,1,2,3 TENSOR_PARALLEL=2 DATA_PARALLEL=2
  # — no extra container, no extra profile.
  vllm:
    <<: [*vllm, *gpu]
    # Two profiles on purpose, and the only service with more than one: "gpu" is
    # a whole GPU server, "model" is an extra box that serves the model and
    # nothing else, pooled by another machine's gateway via its GPU_PEERS.
    profiles: ["gpu", "model"]
    environment:
      CUDA_VISIBLE_DEVICES: ${VLLM_GPUS:-0}
      TENSOR_PARALLEL: ${TENSOR_PARALLEL:-1}
      DATA_PARALLEL: ${DATA_PARALLEL:-1}
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.62}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      REASONING_PARSER: ${REASONING_PARSER:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    ports:
      # Published so a gateway on ANOTHER machine can pool this one. Still
      # loopback-only unless BIND_ADDR says otherwise.
      - "${BIND_ADDR:-127.0.0.1}:${VLLM_PORT:-8601}:8000"

  # An asymmetric second instance, for a card count that does not divide evenly —
  # 3 cards as a tensor-parallel pair plus a single, say. Same image and the same
  # command, inherited from the anchor; only the environment differs, and all of
  # it is in .env. Turn on with COMPOSE_PROFILES=gpu,vllm2.

  # An asymmetric second instance, for a card count that does not divide evenly —
  # 3 cards as a tensor-parallel pair plus a single, say. Same image and the same
  # command, inherited from the anchor; only the environment differs, and all of
  # it is in .env. Turn on with COMPOSE_PROFILES=gpu,vllm2.

  # An asymmetric second instance, for a card count that does not divide evenly —
  # 3 cards as a tensor-parallel pair plus a single, say. Same image and the same
  # command, inherited from the anchor; only the environment differs, and all of
  # it is in .env. Turn on with COMPOSE_PROFILES=gpu,vllm2.
  vllm-2:
    <<: [*vllm, *gpu]
    profiles: ["vllm2"]
    environment:
      CUDA_VISIBLE_DEVICES: ${VLLM_2_GPUS:-2}
      TENSOR_PARALLEL: ${TENSOR_PARALLEL_2:-1}
      DATA_PARALLEL: ${DATA_PARALLEL_2:-1}
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.62}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      REASONING_PARSER: ${REASONING_PARSER:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VLLM_2_PORT:-8611}:8000"
