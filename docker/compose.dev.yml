# ---------------------------------------------------------------------------
#  Local development stack.
#
#  Deliberately *not* the production compose file. Everything that needs a GPU
#  (vllm, infer) lives on the shared GPU server; everything a developer edits
#  (api, web) runs on the host with hot reload. What's left is the stateful
#  middle — Postgres and Redis — and that is all this file starts.
#
#  No GPU, no profiles, no nginx gateway, no LLM_MODE. Use `make dev`.
#  Separate project name (agents-dev) and data dir, so it can coexist with a
#  full `make up` on the same machine without fighting over volumes.
# ---------------------------------------------------------------------------
name: agents-dev

services:
  postgres:
    image: pgvector/pgvector:pg17       # needs pgvector >= 0.7 for sparsevec
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${DEV_DATA_ROOT:-./devdata}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents} -d ${POSTGRES_DB:-agents}"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ${DEV_DATA_ROOT:-./devdata}/redis:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Opt-in: only needed to debug ingest (LibreOffice / OCR / ffmpeg are why this
  # image is large, and why it isn't started by default). `make dev INGEST=1`.
  worker:
    profiles: ["ingest"]
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      target: worker
    image: agents/worker:dev
    restart: unless-stopped
    environment:
      # Inside the container the deps are siblings, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-agents}@postgres:5432/${POSTGRES_DB:-agents}
      REDIS_URL: redis://redis:6379/0
      INFER_BASE_URL: ${INFER_BASE_URL:-http://localhost:8603}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8602/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      STORAGE_ROOT: /storage
      HF_HOME: /models
      OCR_USE_GPU: "false"
    volumes:
      - ${DEV_DATA_ROOT:-./devdata}/storage:/storage
      - ${DEV_DATA_ROOT:-./devdata}/models:/models
      - ${DEV_DATA_ROOT:-./devdata}/out:/out
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
