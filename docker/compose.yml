# ---------------------------------------------------------------------------
#  Agentic Document QA Platform — single-node stack
#
#  GPU topology is chosen by LLM_MODE and realised with compose profiles.
#  The application only ever knows LLM_BASE_URL (the gateway), never a replica.
#    LLM_MODE=single -> profile llm-single : vllm-a
#    LLM_MODE=tp2    -> profile llm-tp2    : vllm-tp  (model split over 2 GPUs)
#    LLM_MODE=dp2    -> profile llm-dp2    : vllm-a + vllm-b (load split)
#  Use the Makefile; it maps LLM_MODE onto COMPOSE_PROFILES for you.
# ---------------------------------------------------------------------------

x-gpu: &gpu
  # All GPUs are exposed to the container; CUDA_VISIBLE_DEVICES selects which
  # ones the process may actually use. This keeps the GPU mapping a pure env
  # var (compose cannot interpolate a list into device_ids).
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm: &vllm
  image: vllm/vllm-openai:latest        # verified against vLLM 0.17 / torch 2.10
  ipc: host
  shm_size: "8gb"
  restart: unless-stopped
  volumes:
    - ${MODEL_DIR}:/root/.cache/huggingface
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    VLLM_LOGGING_LEVEL: INFO
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
    interval: 20s
    timeout: 10s
    retries: 40
    start_period: 900s                  # first run downloads the model weights
  networks: [agents]

services:
  # ---------------------------------------------------------------- storage
  postgres:
    image: pgvector/pgvector:pg17       # needs pgvector >= 0.7 for sparsevec
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [agents]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agents]

  # ------------------------------------------------------------ llm serving
  llm-gateway:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      LLM_MODE: ${LLM_MODE}
    volumes:
      - ./nginx/llm-gateway.conf.tmpl:/etc/nginx/templates/llm.conf.tmpl:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/40-render-llm.sh:ro
    ports:
      - "127.0.0.1:${LLM_GATEWAY_PORT}:80"
    networks: [agents]

  vllm-a:
    <<: [*vllm, *gpu]
    profiles: ["llm-single", "llm-dp2"]
    container_name: agents-vllm-a
    environment: &vllm_env_a
      CUDA_VISIBLE_DEVICES: ${VLLM_A_GPUS}
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION}
      STRUCTURED_OUTPUTS_CONFIG: ${STRUCTURED_OUTPUTS_CONFIG}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER}
      REASONING_PARSER: ${REASONING_PARSER}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 1 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  vllm-b:
    <<: [*vllm, *gpu]
    profiles: ["llm-dp2"]
    container_name: agents-vllm-b
    environment:
      <<: *vllm_env_a
      CUDA_VISIBLE_DEVICES: ${VLLM_B_GPUS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 1 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  vllm-tp:
    <<: [*vllm, *gpu]
    profiles: ["llm-tp2"]
    container_name: agents-vllm-tp
    shm_size: "16gb"
    environment:
      <<: *vllm_env_a
      CUDA_VISIBLE_DEVICES: ${LLM_TP2_GPUS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 2 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  # ------------------------------------------- embeddings / rerank / ASR
  infer:
    <<: *gpu
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      target: infer
    image: agents/infer:dev
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: ${INFER_GPUS}
      HF_HOME: /models
      EMBED_MODEL: ${EMBED_MODEL}
      RERANK_MODEL: ${RERANK_MODEL}
      ASR_MODEL: ${ASR_MODEL}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE}
      ASR_LANGUAGE: ${ASR_LANGUAGE}
    volumes:
      - ${INFER_MODEL_DIR}:/models
      - ${DATA_ROOT}/storage:/storage
    ports:
      - "127.0.0.1:${INFER_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    networks: [agents]

  # ------------------------------------------------------------ application
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: agents/api:dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      STORAGE_ROOT: /storage
    volumes:
      - ${DATA_ROOT}/storage:/storage
      - ${DATA_ROOT}/out:/out
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [agents]

  worker:
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      target: worker
    image: agents/worker:dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      STORAGE_ROOT: /storage
      HF_HOME: /models
    volumes:
      - ${DATA_ROOT}/storage:/storage
      - ${INFER_MODEL_DIR}:/models
      - ${DATA_ROOT}/out:/out
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [agents]

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: agents/web:dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - "0.0.0.0:${WEB_PORT}:3000"
    depends_on:
      api: {condition: service_healthy}
    networks: [agents]

networks:
  agents:
    name: agents
