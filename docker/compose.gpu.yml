# ---------------------------------------------------------------------------
#  GPU side: the two services that need CUDA, and nothing else.
#
#  Start it with `make gpu`. Everything the application needs beyond this —
#  Postgres, Redis, the ingest worker — is the dev side, docker/compose.dev.yml,
#  started with `make dev`. The two are independent: run one, the other, or both
#  on the same machine.
#
#  GPU topology is chosen by LLM_MODE and realised with compose profiles. The
#  application only ever knows LLM_BASE_URL (the gateway), never a replica.
#    single -> vllm-a                      1 GPU
#    tp2    -> vllm-tp                     one model split over 2 GPUs
#    dp2    -> vllm-a + vllm-b             load split, nginx least_conn
#  `make gpu MODE=tp2` switches without touching application config.
# ---------------------------------------------------------------------------
name: agents-gpu

x-gpu: &gpu
  # All GPUs are exposed to the container; CUDA_VISIBLE_DEVICES selects which
  # ones the process may actually use. This keeps the GPU mapping a pure env
  # var (compose cannot interpolate a list into device_ids).
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-vllm: &vllm
  image: vllm/vllm-openai:latest        # verified against vLLM 0.17 / torch 2.10
  ipc: host
  shm_size: "8gb"
  restart: unless-stopped
  volumes:
    - ${MODEL_DIR:-./gpudata/models/vllm}:/root/.cache/huggingface
  environment:
    HF_HOME: /root/.cache/huggingface
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    VLLM_LOGGING_LEVEL: INFO
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
    interval: 20s
    timeout: 10s
    retries: 40
    start_period: 900s                  # first run downloads the model weights
  networks: [agents]

services:
  llm-gateway:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      LLM_MODE: ${LLM_MODE:-single}
    volumes:
      - ./nginx/llm-gateway.conf.tmpl:/etc/nginx/templates/llm.conf.tmpl:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/40-render-llm.sh:ro
    ports:
      # BIND_ADDR=0.0.0.0 publishes the gateway to the network so developers on
      # other machines can point LLM_BASE_URL here. Default stays loopback-only.
      - "${BIND_ADDR:-127.0.0.1}:${LLM_GATEWAY_PORT:-8602}:80"
    networks: [agents]

  vllm-a:
    <<: [*vllm, *gpu]
    profiles: ["llm-single", "llm-dp2"]
    container_name: agents-vllm-a
    environment: &vllm_env_a
      CUDA_VISIBLE_DEVICES: ${VLLM_A_GPUS:-0}
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-main}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-32768}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.62}
      STRUCTURED_OUTPUTS_CONFIG: ${STRUCTURED_OUTPUTS_CONFIG}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-hermes}
      REASONING_PARSER: ${REASONING_PARSER:-}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 1 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  vllm-b:
    <<: [*vllm, *gpu]
    profiles: ["llm-dp2"]
    container_name: agents-vllm-b
    environment:
      <<: *vllm_env_a
      CUDA_VISIBLE_DEVICES: ${VLLM_B_GPUS:-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 1 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  vllm-tp:
    <<: [*vllm, *gpu]
    profiles: ["llm-tp2"]
    container_name: agents-vllm-tp
    shm_size: "16gb"
    environment:
      <<: *vllm_env_a
      CUDA_VISIBLE_DEVICES: ${LLM_TP2_GPUS:-0,1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vllm serve "$$MODEL_ID" \
          --served-model-name "$$SERVED_MODEL_NAME" \
          --max-model-len "$$MAX_MODEL_LEN" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTILIZATION" \
          --tensor-parallel-size 2 \
          --host 0.0.0.0 --port 8000 \
          --structured-outputs-config "$$STRUCTURED_OUTPUTS_CONFIG" \
          $${TOOL_CALL_PARSER:+--tool-call-parser "$$TOOL_CALL_PARSER" --enable-auto-tool-choice} \
          $${REASONING_PARSER:+--reasoning-parser "$$REASONING_PARSER"} \
          $$VLLM_EXTRA_ARGS

  # ------------------------------------------- embeddings / rerank / ASR
  infer:
    <<: *gpu
    build:
      context: ..
      dockerfile: docker/base.Dockerfile
      target: infer
    image: agents/infer:dev
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: ${INFER_GPUS:-1}
      HF_HOME: /models
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8_float16}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-ko}
    volumes:
      - ${INFER_MODEL_DIR:-./gpudata/models/infer}:/models
      - ${GPU_DATA_ROOT:-./gpudata}/storage:/storage
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${INFER_PORT:-8603}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    networks: [agents]

networks:
  agents:
    name: agents-gpu
