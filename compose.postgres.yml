# ---------------------------------------------------------------------------
#  postgres — pgvector: documents, chunks, the message tree, both vector columns.
#
#  Included by compose.yaml — never used directly. What starts is decided by
#  COMPOSE_PROFILES in .env at the repo root.
#
#  Profile: dev.
# ---------------------------------------------------------------------------
services:
  postgres:
    profiles: ["dev"]
    image: pgvector/pgvector:pg17       # needs pgvector >= 0.7 for sparsevec
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agents}
      POSTGRES_DB: ${POSTGRES_DB:-agents}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents} -d ${POSTGRES_DB:-agents}"]
      interval: 3s
      timeout: 5s
      retries: 30
