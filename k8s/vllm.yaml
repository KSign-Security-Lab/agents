# vllm — the model server. Two numbers describe any layout, and nothing else:
#
#   nvidia.com/gpu   cards per copy — vLLM splits one model across them
#   replicas         how many copies — the Service balances between them
#
# 3 cards, three ways: replicas=3 gpu=1 (three independent copies), replicas=1
# gpu=2 (one bigger model, third card left for infer), replicas=1 gpu=3 (one
# model across all three, if the head count divides by 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: vllm }
  strategy:
    # Never take the only replica down before its replacement serves: a rolling
    # update means minutes of weight loading, not seconds.
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      # k3s exposes the NVIDIA toolkit as a RuntimeClass and does NOT make it the
      # default. Without this the pod gets the plain runtime, sees no devices, and
      # fails in a way that reads like a driver problem. Delete this line only on a
      # cluster where nvidia is already the default runtime.
      runtimeClassName: nvidia
      # Spread replicas over nodes rather than stacking them on one box.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: vllm }
      containers:
        - name: vllm
          # Pinned: on a cluster, `latest` lets nodes run different versions.
          image: vllm/vllm-openai:v0.27.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              # How many cards did the scheduler actually give this pod? The
              # device plugin sets CUDA_VISIBLE_DEVICES, so the pod sees only its
              # own, and nvidia-smi counts exactly those. Deriving it means there
              # is one knob — nvidia.com/gpu below — instead of two that have to
              # agree. Ask for 2 cards and the model is split across 2; ask for 1
              # and it is not. Nothing to keep in step.
              GPUS=$(nvidia-smi -L | grep -c '^GPU')
              echo "vllm: $GPUS GPU(s) assigned, tensor-parallel-size=$GPUS"
              exec vllm serve "$MODEL_ID" \
                --served-model-name "$SERVED_MODEL_NAME" \
                --max-model-len "$MAX_MODEL_LEN" \
                --gpu-memory-utilization "$GPU_MEMORY_UTILIZATION" \
                --tensor-parallel-size "$GPUS" \
                --host 0.0.0.0 --port 8000 \
                --structured-outputs-config '{"disable_any_whitespace":true,"backend":"xgrammar"}' \
                ${TOOL_CALL_PARSER:+--tool-call-parser "$TOOL_CALL_PARSER" --enable-auto-tool-choice}
          envFrom:
            - configMapRef: { name: models }
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          ports:
            - { name: http, containerPort: 8000 }
          resources:
            limits:
              # THE knob. How many whole cards one copy of the model gets; vLLM
              # splits itself across all of them automatically. For more
              # throughput instead, raise `replicas` above.
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
            # vLLM needs a large /dev/shm; the default 64Mi will not do. This is
            # what compose's `ipc: host` + `shm_size: 8gb` becomes, without
            # sharing the host's IPC namespace.
            - { name: dshm, mountPath: /dev/shm }
          # A 30GB first pull takes minutes, so slow starts are a startupProbe
          # rather than a long readiness delay: up to 20 minutes to come up, then
          # a tight 10s readiness check for the rest of the pod's life.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        # Weights are a cache, so per-node is fine and avoids needing shared
        # storage. Swap for a ReadWriteMany PVC if you have one — then a new node
        # does not re-download.
        - name: hf-cache
          hostPath: { path: /var/lib/agents/hf, type: DirectoryOrCreate }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
# This Service is what replaces the nginx gateway. kube-proxy load balances over
# every ready pod, and an unready one is removed from rotation automatically —
# which is what max_fails/fail_timeout was approximating.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: agents
spec:
  type: NodePort
  selector: { app: vllm }
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Fixed so a developer's .env can name it: LLM_GATEWAY_PORT=30862.
      nodePort: 30862
